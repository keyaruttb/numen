<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="数灵之息">
  <!-- 数灵之息：一条平直的呼吸线，中间一次真唤醒。
       平的段 = 廉价轮询（零成本静默）；凸起 = 真的有变化时叫醒一次。 -->
  <rect width="64" height="64" rx="12" fill="#1d2433"/>
  <!-- 基线：静默 -->
  <path d="M8 40 H20" stroke="#7f8ea3" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 一次唤醒：起、顶、落 -->
  <path d="M20 40 L26 40 L30 22 L34 50 L38 34 L42 40 L56 40"
        stroke="#5ec8a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 峰值上的一个点：那一次真的叫醒了 -->
  <circle cx="30" cy="22" r="3" fill="#5ec8a0"/>
</svg>
