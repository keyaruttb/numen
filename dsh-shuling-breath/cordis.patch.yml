# dsh-shuling-breath（数灵之息）装配层
#
# 一行 Host 插件。Tier 0 轮询 + Tier 1 真唤醒全部在 lib/ 里。
# 回滚：删掉本文件对应的这一段 insert 即可，不影响其它插件。
#
# 需要改的通常是这两个：
#   sessionId          写死要叫醒哪个会话；空串 = 猜"最后注册的 root agent"（会留痕）
#   pollIntervalSeconds 多久跑一次 Tier 0（硬下限 15 秒）
#
# 2026-11-13 23:19 天令：把 dsh-proactive 的 6 个闹钟迁进 crons（原 id 见每条注释）。
#   6 条都必须给出五段 cron 表达式 + 到点提示语；提示语统一用
#   「先看台账最后 3 条 → 做完做第一格 / 没做完补完再往下 → 真值追加台账 → 没新事实就
#    shuling_silent(reason)」这个形状，具体事项照 新实现计划-20261113.md §四 填。
# 回滚：用 cordis.patch.yml.bak-20261113-2319-before-crons 覆盖本文件。
# 2026-11-13 23:28 天令：加三道门 + 第五类哨兵（会话 liveness）。
#   门 1 峰谷门（读 cost-meter 的 ledger.json，**只读**）+ 余额门（balanceFloorCny）
#   门 2 任务门（未完成.json / 队列.json 的 "状态":"pending" 条数）
#   门 3 liveness（kind:'session'，只 stat 会话 json 的 mtime）
#   ⚠️ 峰谷口径（写在这里方便后人核对；hour 用 UTC、day 用本地 +8，混了会错一小时）：
#        峰 = 09:00–12:00 和 14:00–18:00（北京时间）
#        谷 = 其余全部 + 周末全天 + 假日（12:00–14:00 也是谷）
#   ⚠️ 峰时不是"不许叫醒"，是"叫醒了别干贵的事"：照样唤醒，但 prompt 只给保养清单。
#   回滚：删掉下面 ledgerFile / balanceFloorCny / idleWakeAfterMinutes / idleCooldownMinutes /
#         planFileTemplate / progressLedgerFile 六项 + session 那一条哨兵。
- insert:
    - id: dsh-shuling-breath
      name: 'dsh-shuling-breath'
      config:
        enabled: true
        pollIntervalSeconds: 300
        firstPollDelaySeconds: 20
        # 2026-11-13 23:24 钉死：不填会被猜成"最后注册的 root agent"，
        #   实测被叫到了 session-7e6f6a6d（另一个会话），我这边一声不响。
        sessionId: 'session-40be619a-4fa8-4f96-832c-1957d829aa44'
        maxWakesPerHour: 4
        timeZone: Asia/Shanghai
        # 2026-11-14 天授权 1440 → 180（原话「按你的建议改吧…建议降到 120–180」）。
        #   病灶：11-14 那次断链 18 小时没人发现，因为 1440 分 = 24 小时，18 小时落在阈值内 ⇒ stale:false。
        #   为什么 180：实测 20.8h 内 65 次唤醒（≈75 次/天），相邻唤醒最长间隔 46.4 分 ——
        #              唤醒只是 recall-state 写入的子集，真实停更上界 ≤ 46.4 分；180/46.4 ≈ 3.9 倍余量，
        #              不误报，又能抓住小时级断链。取天给的范围（120–180）的上限，最保守。
        # ⚠️ 这一行优先级高于 lib/config.js 里的默认值 —— 改默认值不改这里，运行时不会变。
        staleAfterMinutes: 180
        silentTool: true

        # ---- 门 1：峰谷门 + 余额门 ----
        # cost-meter 的账本，只读。读法见 lib/gates.js readLedger()：只切 config /
        # balanceRef / days[today] 三小段再 parse，绝不整份 888 KB parse 到内存里。
        ledgerFile: 'C:\Users\27875\.dsh\storages\cost-meter\ledger.json'
        # 余额（CNY）低于这个数 ⇒ 连保养也不做，只记录。
        balanceFloorCny: 10

        # ---- 门 2：任务门 ----
        # 不写就用 sentinels 里 kind: unfinished / queue 的 path（只维护一处）。
        # unfinishedFile: 'C:\dsh\_溯\息壤\事\未完成.json'
        # queueFile: 'C:\dsh\_溯\息壤\事\队列.json'

        # ---- 门 3：liveness（第五类哨兵）----
        # 会话 json 的 mtime 静默超过 20 分钟 ⇒ change='idle' ⇒ 唤醒
        idleWakeAfterMinutes: 20
        # 唤醒后 20 分钟内一律不判 liveness（给那一轮跑完，也防死循环）
        idleCooldownMinutes: 20
        # 凌晨计划模板：{yyyymmdd} 由 lib/prompt.js 按"本地 9 点前算当天、9 点后算明天"替换
        planFileTemplate: 'C:\dsh\_溯\息壤\事\凌晨计划-{yyyymmdd}.md'
        # 唤醒 prompt 里"做完把真值追加进"的那份
        progressLedgerFile: 'C:\dsh\_溯\息壤\事\进度台账.md'

        logFile: 'C:\dsh\_ops\safe\shuling-breath.log'
        stateFile: 'C:\dsh\_ops\safe\shuling-breath.state.json'
        sentinels:
          # 🔧 2026-11-23 移植改动：原版这 5 条全部指向「息壤」，而息壤 2026-11-23 上午已经关闸。
          #    实测（11-23 17:0x 查的文件 mtime）：
          #      队列.json          最后写 11-11 21:46（283 小时前）→ 永远「没变」→ 永不触发
          #      未完成.json        最后写 11-17 22:12（139 小时前）→ 同上
          #      recall-state.json  最后写 11-22 15:26（25.8 小时前）→ 而 staleAfterMinutes=180(3h)
          #                         ⇒ 每跳都判 recall:stale ⇒ 每跳都唤醒 + 每跳报「落盘链断了」
          #      息壤-未读.json      同族，也不再更新
          #    ⇒ 阶段 0 只留 session（会话投影 json 的 mtime）——唯一还活着的信号，
          #      而且「会话静默多久」本来就是「该不该醒」最直接的依据。
          #    ⚠️ 这四条**不是删掉**，是注释掉：想启用哪条把 `#` 去掉即可。
          #       lib/config.js 里的默认值也留了同样的注释，两处一致。
          #    依据：C:\dsh\_溯\数灵之息-移植计划-20261123.md 第二节
          # - id: queue
          #   kind: queue
          #   required: true
          #   path: 'C:\dsh\_溯\息壤\事\队列.json'
          # - id: unfinished
          #   kind: unfinished
          #   required: true
          #   path: 'C:\dsh\_溯\息壤\事\未完成.json'
          # - id: recall
          #   kind: recall
          #   required: true
          #   path: 'C:\dsh\_溯\息壤\记忆\state\recall-state.json'
          # - id: unread
          #   kind: generic
          #   required: false
          #   path: 'C:\dsh\_溯\息壤\息壤-未读.json'
          # 2026-11-13 23:28：第五类哨兵 —— 唯一一类"关于我自己"的。
          # 只 stat 它的 mtime，绝不读内容（3.58 MB）。
          # 已验真值：23:21:35 时它 0.1 分钟前刚被写，每轮都变。
          # ⚠️ 不能用 inject_log 表：它停在 2026-11-12T20:40，是 ling 时代的表，息壤不写它。
          - id: session
            kind: session
            required: false
            path: 'C:\Users\27875\.dsh\storages\session_projcache\sessions\session-40be619a-4fa8-4f96-832c-1957d829aa44.json'
        crons:
          # 原 mwdhh2h7sgwp3o（dsh-proactive `every 7200s`）→ `0 */2 * * *`
          - expr: '0 */2 * * *'
            timeZone: Asia/Shanghai
            prompt: |-
              到点（每 2 小时兜底心跳）。先看 C:\dsh\_溯\息壤\事\进度台账.md 的最后 3 条判断：上一跳做的事做完没有？
                做完 ⇒ 做下面这件事的第一格：读 C:\dsh\_溯\息壤\事\未完成.json 的第一条，再看 C:\dsh\_溯\息壤\记忆\state\recall-state.json 的 at 与 seats 字段，定出上一跳停在哪；挑最小的一格做完，把判据命令的原始输出贴回台账
                没做完 ⇒ 补完再往下，不许并堆
              做完把真值（命令原始输出、行号、数字）追加进台账。
              没新事实就调 shuling_silent(reason) 结束，不许输出正文，不许写"我在/已完成"。

          # 原 mwey69fl3wudwj（`5 0,12,18 * * *`）
          - expr: '5 0,12,18 * * *'
            timeZone: Asia/Shanghai
            prompt: |-
              到点（三个谷值时段的开工：00:05 夜段 / 12:05 午段 / 18:05 晚段）。先看 C:\dsh\_溯\息壤\事\进度台账.md 的最后 3 条判断：上一跳做的事做完没有？
                做完 ⇒ 做下面这件事的第一格：先看本地时间落在哪段 —— 00–09 夜段按 C:\dsh\_溯\息壤\新实现计划-20261113.md §四.1 的第一格（02:00 备份后 02:20 只改一处：P1 三件里当前那件，改完立刻跑该件判据）；12–14 午段按 §四.2 的第一格（读 事\未完成.json 挑一条 ≤30 分钟的修口，只做这一条）；18–24 晚段按 §四.3 的第一格（读 事\未完成.json + 今天的实装真值，再决定派哪个只读类化身）
                没做完 ⇒ 补完再往下，不许并堆
              做完把真值（命令原始输出、行号、数字）追加进台账。
              没新事实就调 shuling_silent(reason) 结束，不许输出正文，不许写"我在/已完成"。

          # 原 mwey6fg486dbg9（`0 3,6 * * *`）
          - expr: '0 3,6 * * *'
            timeZone: Asia/Shanghai
            prompt: |-
              到点（夜段中段检查点：03:00 第二处 / 06:00 60 轮对照）。先看 C:\dsh\_溯\息壤\事\进度台账.md 的最后 3 条判断：上一跳做的事做完没有？
                做完 ⇒ 做下面这件事的第一格：03:00 ⇒ 看 §四.1「02:20 只改一处」那处改完没有，没改完先补完，改完才做「04:00 第二处改动 + 它的判据」；06:00 ⇒ 跑 §四.1「06:00 60 轮对照」（心光方案 §五 那条命令，三个 query 三种形状），原始输出逐字贴回台账
                没做完 ⇒ 补完再往下，不许并堆
              做完把真值（命令原始输出、行号、数字）追加进台账。
              没新事实就调 shuling_silent(reason) 结束，不许输出正文，不许写"我在/已完成"。

          # 原 mwey6lw9w2f7i7（`0 21 * * *`）
          - expr: '0 21 * * *'
            timeZone: Asia/Shanghai
            prompt: |-
              到点（每天 21:00 停手学习，§四.3 的 21:00–21:40）。先看 C:\dsh\_溯\息壤\事\进度台账.md 的最后 3 条判断：上一跳做的事做完没有？
                做完 ⇒ 做下面这件事的第一格：读 C:\dsh\_溯\息壤\新实现计划-20261113.md §三 表里今天那一行，按它只读一份、不读第二份；判据是「一条能改设计的结论」，并落到 C:\dsh\_溯\息壤\细\学习\2026-MM-DD-*.md（没有这一句就记「这次没读出来」，别装读懂）
                没做完 ⇒ 补完再往下，不许并堆
              做完把真值（命令原始输出、行号、数字）追加进台账。
              没新事实就调 shuling_silent(reason) 结束，不许输出正文，不许写"我在/已完成"。

          # 原 mwey6rx5zji43d（`30 8,23 * * *`）
          - expr: '30 8,23 * * *'
            timeZone: Asia/Shanghai
            prompt: |-
              到点（写回：08:30 夜段真值 / 23:30 文档与明日第一件事）。先看 C:\dsh\_溯\息壤\事\进度台账.md 的最后 3 条判断：上一跳做的事做完没有？
                做完 ⇒ 做下面这件事的第一格：08:30 ⇒ 按 §四.1「08:00 写回」把夜段真值写进 C:\dsh\_溯\息壤\事\2026-11-DD-实装.md，计划里那一格标完成或标「没打出来」；23:30 ⇒ 按 §四.3 写回 总设计 / 实装清单 / 本计划当天那格，并把明天的第一件事写进 事\未完成.json
                没做完 ⇒ 补完再往下，不许并堆
              做完把真值（命令原始输出、行号、数字）追加进台账。
              没新事实就调 shuling_silent(reason) 结束，不许输出正文，不许写"我在/已完成"。

          # 原 mwey6xxck4a871（`0 14 * * *`）
          - expr: '0 14 * * *'
            timeZone: Asia/Shanghai
            prompt: |-
              到点（午段收尾，§四.2 的 13:40–14:00）。先看 C:\dsh\_溯\息壤\事\进度台账.md 的最后 3 条判断：上一跳做的事做完没有？
                做完 ⇒ 做下面这件事的第一格：把下一段（18:00）要做的那一件事写进 C:\dsh\_溯\息壤\事\未完成.json，并把本段的对账结果（每条数字标出处）贴进台账
                没做完 ⇒ 补完再往下，不许并堆
              做完把真值（命令原始输出、行号、数字）追加进台账。
              没新事实就调 shuling_silent(reason) 结束，不许输出正文，不许写"我在/已完成"。
